# Railway production profile
# All values come from Railway environment variables set in the dashboard.
# Never commit real secrets here.

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 10000
      keepalive-time: 60000
      max-lifetime: 300000
      minimum-idle: 1
      maximum-pool-size: 3

server:
  port: ${PORT:8080}

# Google OAuth2 — set GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET in Railway dashboard
spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id:     ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - email
              - profile
