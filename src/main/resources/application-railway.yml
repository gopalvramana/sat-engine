# Railway production profile
# All values come from Railway environment variables set in the dashboard.
# Never commit real secrets here.

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 10000
      keepalive-time: 60000
      max-lifetime: 300000
      minimum-idle: 1
      maximum-pool-size: 3

server:
  port: ${PORT:8080}
