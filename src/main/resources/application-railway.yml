# Railway production profile
# All values come from Railway environment variables set in the dashboard.
# Never commit real secrets here.

spring:
  datasource:
    url: "jdbc:postgresql://${DB_HOST}/${DB_NAME}?sslmode=require&options=endpoint%3D${DB_ENDPOINT}"
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

server:
  port: ${PORT:8080}
