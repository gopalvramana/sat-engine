<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Question Review — SAT Engine Admin</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"
        crossorigin="anonymous">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"
          crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
          crossorigin="anonymous"></script>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"
          crossorigin="anonymous"></script>

  <link rel="stylesheet" href="css/validate.css?v=5">
  <link rel="stylesheet" href="css/validate2.css?v=8">
  <style>
    /* ── App colour scheme overrides ─────────────────────────── */
    body { background: #f5f0e8 !important; }

    .v-header .nav-btn {
      background: rgba(255,255,255,0.07) !important;
      border: 1.5px solid rgba(255,255,255,0.18) !important;
      color: rgba(255,255,255,0.75) !important;
      font-weight: 600 !important;
    }
    .v-header .nav-btn:hover:not(:disabled) {
      background: rgba(255,255,255,0.13) !important;
      border-color: rgba(255,255,255,0.35) !important;
      color: #fff !important;
    }
    .v-header .nav-btn:disabled {
      opacity: 0.3 !important;
    }
    /* Keep amber-styled buttons their own colour */
    .v-header #btn-coverage,
    .v-header a.nav-btn {
      background: rgba(251,191,36,0.1) !important;
    }
    .v-header #btn-coverage:hover,
    .v-header a.nav-btn:hover {
      background: rgba(251,191,36,0.2) !important;
      border-color: #fbbf24 !important;
    }
    /* Page navigation */
    .page-nav { display: flex; gap: 4px; margin-left: 6px; }
    .page-nav a {
      font-size: 12px; font-weight: 500;
      color: rgba(255,255,255,0.55);
      text-decoration: none;
      padding: 5px 11px; border-radius: 6px;
      border: 1.5px solid transparent;
      transition: background 0.12s, color 0.12s;
    }
    .page-nav a:hover { background: rgba(255,255,255,0.08); color: #fff; }
    .page-nav a.active {
      background: rgba(251,191,36,0.15);
      border-color: rgba(251,191,36,0.4);
      color: #fbbf24; font-weight: 600;
    }
  </style>
  <script src="js/renderer.js?v=14"></script>
</head>
<body style="background:#f5f0e8">

<div class="v-layout">

  <!-- ══ HEADER ═══════════════════════════════════════════════ -->
  <header class="v-header"
          style="background:#1c1008; border-bottom:1px solid rgba(255,255,255,0.08); box-shadow:0 2px 8px rgba(28,16,8,0.3);">
    <div class="px-5 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div>
          <p class="text-xs leading-tight" style="color:rgba(255,255,255,0.45)">SAT Engine Admin</p>
          <p class="text-sm font-bold leading-tight" style="color:#ffffff">Question Review</p>
        </div>
      </div>
      <div id="nav-controls" class="flex items-center gap-2">
        <button id="btn-prev" class="nav-btn" onclick="navigate(-1)" disabled>← Prev</button>
        <span id="nav-counter" class="text-xs font-semibold min-w-[64px] text-center" style="color:rgba(255,255,255,0.5)">— / —</span>
        <button id="btn-next" class="nav-btn" onclick="navigate(1)" disabled>Next →</button>
        <span id="queue-badge"
              class="hidden text-xs bg-amber-100 text-amber-800 font-semibold px-2 py-0.5 rounded-full ml-2"></span>
      </div>
      <div class="flex items-center gap-2">
        <p id="header-sub" class="text-xs hidden md:block" style="color:rgba(255,255,255,0.4)">Loading…</p>
        <button onclick="toggleView()" id="btn-coverage"
                class="nav-btn flex items-center gap-1.5"
                style="border-color:rgba(251,191,36,0.5); color:#fbbf24;">
          📊 Coverage
        </button>
        <nav class="page-nav">
          <a href="/admin/validate.html" class="active">Review</a>
          <a href="/admin/pipeline.html">Pipeline</a>
          <a href="/admin/spread.html">Spread</a>
        </nav>
      </div>
    </div>
  </header>

  <!-- ══ SIDEBAR ═══════════════════════════════════════════════ -->
  <aside class="v-sidebar">

    <div class="px-3 py-1.5 text-xs font-semibold text-slate-400 uppercase tracking-wide border-b border-slate-200">
      Stats
    </div>
    <div id="stats-panel">
      <div class="stat-row"><span class="label">Total</span><span id="stat-total" class="value">—</span></div>
      <div class="stat-row"><span class="label">⏳ Pending</span><span id="stat-pending" class="value text-amber-600">—</span></div>
      <div class="stat-row"><span class="label">✅ Approved</span><span id="stat-approved" class="value text-green-600">—</span></div>
      <div class="stat-row"><span class="label">❌ Rejected</span><span id="stat-rejected" class="value text-red-500">—</span></div>
    </div>

    <div class="px-3 py-1.5 text-xs font-semibold text-slate-400 uppercase tracking-wide border-b border-t border-slate-200 mt-1">
      Show
    </div>
    <button class="filter-btn active" data-filter="all"      onclick="setFilter('all',this)">All questions</button>
    <button class="filter-btn"        data-filter="pending"  onclick="setFilter('pending',this)">⏳ Pending</button>
    <button class="filter-btn"        data-filter="approved" onclick="setFilter('approved',this)">✅ Approved</button>
    <button class="filter-btn"        data-filter="rejected" onclick="setFilter('rejected',this)">❌ Rejected</button>

    <div class="px-3 py-1.5 text-xs font-semibold text-slate-400 uppercase tracking-wide border-b border-t border-slate-200 mt-1">
      Queue
    </div>
    <div class="px-2 py-1.5 border-b border-slate-200">
      <input id="q-search" class="q-search" type="text"
             placeholder="Search ID, domain, stem…"
             oninput="setSearch(this.value)">
    </div>

    <div class="flex gap-1 px-2 py-1.5 border-b border-slate-200">
      <button id="sec-all"  class="sec-pill active" onclick="setSection('all')">All</button>
      <button id="sec-math" class="sec-pill"        onclick="setSection('math')">Math</button>
      <button id="sec-rw"   class="sec-pill"        onclick="setSection('rw')">R&amp;W</button>
    </div>

    <div id="domain-list"></div>
    <div id="q-list"></div>

  </aside>

  <!-- ══ MAIN ══════════════════════════════════════════════════ -->
  <main class="v-main">
    <div id="question-area">
      <div class="empty-panel">
        <div style="font-size:2.5rem">⏳</div>
        <p class="mt-3">Loading questions…</p>
      </div>
    </div>
  </main>

</div>

<div id="toast"></div>

<script src="js/validate.js?v=7"></script>
</body>
</html>
