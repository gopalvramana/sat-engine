<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SymPy Review — SAT Engine Admin</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" crossorigin="anonymous">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js" crossorigin="anonymous"></script>

  <link rel="stylesheet" href="css/validate.css?v=5">
  <link rel="stylesheet" href="css/validate2.css?v=8">

  <style>
    body { background: #f5f0e8 !important; font-family: 'Inter', sans-serif; }

    /* ── Header ────────────────────────────────────────────────── */
    .sr-header {
      background: #0e1c2f;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      position: sticky; top: 0; z-index: 100;
    }
    .nav-btn {
      background: rgba(255,255,255,0.07);
      border: 1.5px solid rgba(255,255,255,0.18);
      color: rgba(255,255,255,0.75);
      font-weight: 600;
      padding: 5px 14px; border-radius: 7px;
      font-size: 13px; cursor: pointer; text-decoration: none;
      transition: background 0.12s, color 0.12s;
    }
    .nav-btn:hover { background: rgba(255,255,255,0.13); color: #fff; }

    /* ── Toolbar ───────────────────────────────────────────────── */
    .toolbar {
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      padding: 12px 24px;
      display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
    }
    .toolbar select, .toolbar input {
      border: 1.5px solid #d1d5db; border-radius: 7px;
      padding: 6px 10px; font-size: 13px; background: #fafafa;
    }
    .toolbar select:focus, .toolbar input:focus {
      outline: none; border-color: #6366f1;
    }
    .toolbar label { font-size: 12px; font-weight: 600; color: #6b7280; }

    /* ── Stats bar ─────────────────────────────────────────────── */
    .stats-bar {
      background: #0e1c2f; color: #fff;
      padding: 8px 24px;
      display: flex; gap: 24px; align-items: center; flex-wrap: wrap;
      font-size: 13px;
    }
    .stat-pill {
      display: flex; align-items: center; gap: 6px;
    }
    .stat-pill .badge {
      font-weight: 700; padding: 2px 9px;
      border-radius: 20px; font-size: 12px;
    }

    /* ── Question cards (legacy, kept for badge/button styles) ─── */
    .q-card {
      background: #fff;
      border-radius: 12px;
      border: 1.5px solid #e5e7eb;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      overflow: hidden;
      transition: box-shadow 0.15s;
    }
    .q-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.10); }
    .q-card.approved { border-color: #22c55e; }
    .q-card.rejected { border-color: #ef4444; opacity: 0.7; }
    .q-card.generated_flagged { border-color: #f59e0b; }

    .q-card-header {
      padding: 10px 14px;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid #f3f4f6;
      background: #f9fafb;
    }
    .q-id { font-size: 12px; font-weight: 700; color: #6366f1; font-family: monospace; }
    .q-meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

    .badge-skill {
      background: #ede9fe; color: #7c3aed;
      font-size: 11px; font-weight: 600;
      padding: 2px 8px; border-radius: 20px;
    }
    .badge-diff {
      background: #fef3c7; color: #92400e;
      font-size: 11px; font-weight: 700;
      padding: 2px 8px; border-radius: 20px;
    }
    .badge-type {
      background: #dbeafe; color: #1e40af;
      font-size: 11px; font-weight: 600;
      padding: 2px 8px; border-radius: 20px;
    }
    .badge-status {
      font-size: 11px; font-weight: 600;
      padding: 2px 8px; border-radius: 20px;
    }
    .badge-status.generated    { background: #e0f2fe; color: #0369a1; }
    .badge-status.generated_flagged { background: #fef9c3; color: #a16207; }
    .badge-status.approved     { background: #dcfce7; color: #15803d; }
    .badge-status.rejected     { background: #fee2e2; color: #b91c1c; }
    .badge-status.promoted     { background: #ede9fe; color: #6d28d9; }

    .badge-pool {
      font-size: 11px; font-weight: 600;
      padding: 2px 8px; border-radius: 20px;
    }
    .badge-pool.diagnostic { background: #ede9fe; color: #7c3aed; }
    .badge-pool.drill      { background: #dbeafe; color: #1e40af; }
    .badge-pool.test       { background: #fef3c7; color: #92400e; }
    .badge-pool.reference  { background: #f3f4f6; color: #4b5563; }

    .q-card.promoted { border-color: #8b5cf6; }

    .q-body { padding: 14px 16px; }

    /* Question stem */
    .q-stem {
      font-size: 15px; line-height: 1.6; color: #111827;
      margin-bottom: 14px;
    }

    /* Options */
    .q-options { display: flex; flex-direction: column; gap: 7px; margin-bottom: 14px; }
    .q-option {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 8px 11px; border-radius: 8px;
      border: 1.5px solid #e5e7eb;
      font-size: 14px; line-height: 1.5; color: #374151;
      background: #fafafa;
    }
    .q-option.correct {
      border-color: #22c55e;
      background: #f0fdf4;
    }
    .q-option .opt-letter {
      font-weight: 700; font-size: 12px;
      color: #6b7280; min-width: 16px; padding-top: 1px;
    }
    .q-option.correct .opt-letter { color: #16a34a; }

    /* SPR answer */
    .spr-answer {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 11px; border-radius: 8px;
      border: 1.5px solid #22c55e; background: #f0fdf4;
      font-size: 14px; color: #15803d; font-weight: 600;
      margin-bottom: 14px;
    }

    /* Explanation */
    .q-explanation {
      font-size: 13px; color: #6b7280; line-height: 1.5;
      margin-bottom: 10px;
    }

    /* Diagram */
    .q-diagram { margin: 10px 0; text-align: center; cursor: zoom-in; }
    .q-diagram svg { max-width: 100%; }
    .q-diagram:hover { opacity: 0.85; }

    /* Diagram modal */
    .diag-modal-overlay {
      display: none; position: fixed; inset: 0; z-index: 1000;
      background: rgba(0,0,0,0.6); backdrop-filter: blur(3px);
      align-items: center; justify-content: center;
    }
    .diag-modal-overlay.open { display: flex; }
    .diag-modal-box {
      background: #fff; border-radius: 16px;
      padding: 24px; max-width: 90vw; max-height: 90vh;
      overflow: auto; position: relative;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    .diag-modal-close {
      position: absolute; top: 12px; right: 14px;
      font-size: 20px; cursor: pointer; color: #6b7280;
      background: none; border: none; line-height: 1;
    }
    .diag-modal-close:hover { color: #111; }
    .diag-modal-title {
      font-size: 13px; font-weight: 700; color: #6366f1;
      font-family: monospace; margin-bottom: 16px;
    }

    /* Flag banner */
    .flag-banner {
      background: #fef9c3; border: 1px solid #fde047;
      border-radius: 7px; padding: 7px 11px;
      font-size: 12px; color: #a16207;
      margin-bottom: 10px;
      display: flex; gap: 6px; align-items: flex-start;
    }

    /* Debug panel */
    .debug-panel {
      background: #1e1e1e; color: #d4d4d4;
      border-radius: 8px; font-size: 11px; font-family: monospace;
      padding: 10px 12px; margin-top: 10px;
      max-height: 200px; overflow-y: auto;
      white-space: pre-wrap; word-break: break-all;
      display: none;
    }
    .debug-panel.open { display: block; }

    /* Actions */
    .q-actions {
      padding: 10px 14px;
      border-top: 1px solid #f3f4f6;
      display: flex; gap: 8px; align-items: center;
      flex-wrap: wrap;
    }
    .btn-approve {
      background: #22c55e; color: #fff;
      border: none; border-radius: 7px;
      padding: 6px 16px; font-size: 13px; font-weight: 600;
      cursor: pointer; transition: background 0.12s;
    }
    .btn-approve:hover { background: #16a34a; }
    .btn-reject {
      background: #ef4444; color: #fff;
      border: none; border-radius: 7px;
      padding: 6px 16px; font-size: 13px; font-weight: 600;
      cursor: pointer; transition: background 0.12s;
    }
    .btn-reject:hover { background: #dc2626; }
    .btn-revert {
      background: #f3f4f6; color: #374151;
      border: 1.5px solid #d1d5db; border-radius: 7px;
      padding: 6px 14px; font-size: 13px; font-weight: 600;
      cursor: pointer; transition: background 0.12s;
    }
    .btn-revert:hover { background: #e5e7eb; }
    .btn-promote {
      background: #7c3aed; color: #fff;
      border: none; border-radius: 7px;
      padding: 6px 16px; font-size: 13px; font-weight: 600;
      cursor: pointer; transition: background 0.12s;
    }
    .btn-promote:hover { background: #6d28d9; }
    .btn-approve-only {
      background: transparent; color: #15803d;
      border: 1.5px solid #22c55e; border-radius: 7px;
      padding: 5px 12px; font-size: 12px; font-weight: 600;
      cursor: pointer; transition: background 0.12s;
    }
    .btn-approve-only:hover { background: #f0fdf4; }
    .pool-override {
      border: 1.5px solid #d1d5db; border-radius: 6px;
      padding: 4px 8px; font-size: 12px; background: #fafafa;
      cursor: pointer;
    }
    .pool-override:focus { outline: none; border-color: #7c3aed; }
    .btn-debug {
      margin-left: auto;
      background: transparent; color: #9ca3af;
      border: 1.5px solid #e5e7eb; border-radius: 7px;
      padding: 5px 11px; font-size: 12px;
      cursor: pointer; transition: color 0.1s;
    }
    .btn-debug:hover { color: #6366f1; border-color: #6366f1; }

    /* Loading */
    .loading-bar {
      height: 3px; background: #6366f1;
      animation: loading 1.2s ease-in-out infinite;
      transform-origin: left;
    }
    @keyframes loading { 0%,100%{transform:scaleX(0.2)} 50%{transform:scaleX(0.9)} }

    /* Two-panel layout */
    .review-layout {
      display: flex;
      height: calc(100vh - 160px);
      overflow: hidden;
    }

    /* Left sidebar */
    .q-sidebar {
      width: 300px;
      min-width: 260px;
      border-right: 1px solid #e5e7eb;
      background: #f9fafb;
      overflow-y: auto;
      flex-shrink: 0;
    }
    .sidebar-header {
      padding: 10px 12px;
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.05em; color: #6b7280;
      border-bottom: 1px solid #e5e7eb;
      background: #fff;
      position: sticky; top: 0; z-index: 1;
    }
    .sidebar-item {
      padding: 9px 12px;
      border-bottom: 1px solid #f3f4f6;
      cursor: pointer;
      display: flex; flex-direction: column; gap: 4px;
      transition: background 0.1s;
    }
    .sidebar-item:hover { background: #ede9fe; }
    .sidebar-item.active { background: #ede9fe; border-left: 3px solid #6366f1; }
    .sidebar-item.active .si-id { color: #4f46e5; }
    .si-id { font-size: 11px; font-weight: 700; color: #6b7280; font-family: monospace; }
    .si-meta { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
    .si-skill { font-size: 10px; font-weight: 600; padding: 1px 6px; border-radius: 10px; background: #ede9fe; color: #7c3aed; }
    .si-diff  { font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 10px; background: #fef3c7; color: #92400e; }
    .si-status { font-size: 10px; font-weight: 600; padding: 1px 6px; border-radius: 10px; }
    .si-status.generated { background: #e0f2fe; color: #0369a1; }
    .si-status.generated_flagged { background: #fef9c3; color: #a16207; }
    .si-status.approved  { background: #dcfce7; color: #15803d; }
    .si-status.rejected  { background: #fee2e2; color: #b91c1c; }
    .si-status.promoted  { background: #ede9fe; color: #6d28d9; }

    /* Right detail panel */
    .q-detail {
      flex: 1;
      overflow-y: auto;
      background: #f5f0e8;
      padding: 24px;
    }
    .detail-empty {
      display: flex; align-items: center; justify-content: center;
      height: 100%; color: #9ca3af; font-size: 15px;
    }

    /* Detail card */
    .detail-card {
      background: #fff;
      border-radius: 14px;
      border: 1.5px solid #e5e7eb;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      overflow: hidden;
      max-width: 1300px;
      margin: 0 auto;
    }
    .detail-card.approved  { border-color: #22c55e; }
    .detail-card.rejected  { border-color: #ef4444; opacity: 0.8; }
    .detail-card.promoted  { border-color: #8b5cf6; }
    .detail-card.generated_flagged { border-color: #f59e0b; }

    .detail-header {
      padding: 12px 18px;
      background: #f9fafb;
      border-bottom: 1px solid #f3f4f6;
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 8px;
    }
    .detail-nav {
      display: flex; align-items: center; gap: 8px;
    }
    .nav-arrow {
      background: #f3f4f6; border: 1.5px solid #d1d5db;
      border-radius: 7px; padding: 4px 12px; font-size: 14px;
      cursor: pointer; font-weight: 700;
      transition: background 0.12s;
    }
    .nav-arrow:hover:not(:disabled) { background: #e5e7eb; }
    .nav-arrow:disabled { opacity: 0.35; cursor: not-allowed; }
    .nav-counter { font-size: 12px; color: #6b7280; font-weight: 600; min-width: 60px; text-align: center; }

    .detail-body { padding: 20px 22px; }

    /* Question stem */
    .detail-stem {
      font-size: 17px; line-height: 1.7; color: #111827;
      margin-bottom: 18px;
    }

    /* Options */
    .detail-options { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
    .detail-option {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 10px 13px; border-radius: 9px;
      border: 1.5px solid #e5e7eb;
      font-size: 14px; line-height: 1.5; color: #374151;
      background: #fafafa;
    }
    .detail-option.correct { border-color: #22c55e; background: #f0fdf4; }
    .opt-letter { font-weight: 700; font-size: 12px; color: #6b7280; min-width: 18px; padding-top: 1px; }
    .detail-option.correct .opt-letter { color: #16a34a; }

    /* SPR */
    .detail-spr {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 13px; border-radius: 9px;
      border: 1.5px solid #22c55e; background: #f0fdf4;
      font-size: 15px; color: #15803d; font-weight: 600;
      margin-bottom: 18px;
    }

    /* Section blocks */
    .detail-section {
      border-top: 1px solid #f3f4f6;
      padding: 14px 0 4px;
      margin-bottom: 4px;
    }
    .detail-section-title {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.06em; color: #9ca3af; margin-bottom: 10px;
    }

    /* Core concept */
    .core-concept-box {
      background: #ede9fe; border-radius: 8px;
      padding: 10px 14px; font-size: 14px; color: #4c1d95; font-weight: 500;
    }

    /* Prerequisites */
    .prereq-list { display: flex; gap: 7px; flex-wrap: wrap; }
    .prereq-tag {
      background: #dbeafe; color: #1e40af;
      font-size: 12px; font-weight: 600;
      padding: 3px 10px; border-radius: 20px;
    }

    /* Solution steps */
    .steps-list { display: flex; flex-direction: column; gap: 10px; }
    .step-row {
      display: flex; gap: 12px; align-items: flex-start;
    }
    .step-num {
      width: 24px; height: 24px; border-radius: 50%;
      background: #6366f1; color: #fff;
      font-size: 11px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; margin-top: 2px;
    }
    .step-content { font-size: 14px; line-height: 1.6; color: #374151; }
    .step-title { font-weight: 700; color: #111827; margin-bottom: 3px; font-size: 14px; }

    /* Distractor rationale */
    .distractor-list { display: flex; flex-direction: column; gap: 8px; }
    .distractor-row {
      display: flex; gap: 10px; align-items: flex-start;
      padding: 8px 11px; background: #fff7ed; border-radius: 7px;
      border: 1px solid #fed7aa; font-size: 13px;
    }
    .distractor-letter {
      font-weight: 700; font-size: 12px; color: #ea580c;
      min-width: 16px;
    }

    /* Alternative approach */
    .alt-approach-box {
      background: #f0fdf4; border-radius: 8px;
      padding: 11px 14px; font-size: 14px; color: #166534; line-height: 1.6;
      border: 1px solid #bbf7d0;
    }

    /* Flag banner (detail) */
    .flag-banner {
      background: #fef9c3; border: 1px solid #fde047;
      border-radius: 7px; padding: 8px 12px;
      font-size: 13px; color: #a16207;
      margin-bottom: 14px;
      display: flex; gap: 7px; align-items: flex-start;
    }

    /* Actions bar */
    .detail-actions {
      padding: 14px 18px;
      border-top: 1px solid #f3f4f6;
      display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
      background: #f9fafb;
    }

    /* Debug panel (detail) */
    .debug-panel {
      background: #1e1e1e; color: #d4d4d4;
      border-radius: 8px; font-size: 11px; font-family: monospace;
      padding: 10px 12px; margin-top: 10px;
      max-height: 220px; overflow-y: auto;
      white-space: pre-wrap; word-break: break-all;
      display: none;
    }
    .debug-panel.open { display: block; }

    /* Two-column detail body */
    .detail-columns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      align-items: start;
    }
    .detail-left {
      padding-right: 22px;
      border-right: 1px solid #f3f4f6;
    }
    .detail-right {
      padding-left: 22px;
    }
    .detail-right .detail-section:first-child {
      border-top: none;
      padding-top: 0;
    }

    /* Clickable stat pills */
    .stat-pill { cursor: pointer; transition: opacity 0.15s; }
    .stat-pill:hover { opacity: 0.75; }
    .stat-pill.active-filter .badge { outline: 2px solid #fff; outline-offset: 1px; }
  </style>

  <script src="js/renderer.js?v=14"></script>
</head>
<body>

<!-- ══ HEADER ══════════════════════════════════════════════════════════════ -->
<header class="sr-header">
  <div class="px-6 py-3 flex items-center justify-between">
    <div class="flex items-center gap-4">
      <span style="font-size:18px; font-weight:800; color:#fff; letter-spacing:-0.5px;">
        ⚗️ SymPy Review
      </span>
      <nav style="display:flex; gap:4px; margin-left:8px;">
        <a href="validate.html" class="nav-btn" style="font-size:12px;">LLM Pipeline</a>
        <a href="sympy-review.html" class="nav-btn"
           style="background:rgba(99,102,241,0.2); border-color:rgba(99,102,241,0.5); color:#a5b4fc; font-size:12px;">
          SymPy Pipeline
        </a>
        <a href="pipeline.html" class="nav-btn" style="font-size:12px;">Pipeline Jobs</a>
        <a href="spread.html" class="nav-btn" style="font-size:12px;">Coverage</a>
      </nav>
    </div>
    <div class="flex items-center gap-3">
      <button id="btn-refresh" class="nav-btn" onclick="loadQuestions()">↻ Refresh</button>
      <span id="count-badge" style="font-size:12px; color:rgba(255,255,255,0.5);"></span>
    </div>
  </div>
</header>

<!-- Loading bar -->
<div id="loading-bar" class="loading-bar" style="display:none;"></div>

<!-- ══ STATS BAR ════════════════════════════════════════════════════════════ -->
<div class="stats-bar" id="stats-bar" style="display:none;">
  <span style="font-weight:700; font-size:12px; color:rgba(255,255,255,0.4); text-transform:uppercase; letter-spacing:0.5px;">
    Summary
  </span>
  <div class="stat-pill" id="pill-generated" onclick="setStatusFilter('generated')" title="Show pending questions">
    <span class="badge" style="background:#f59e0b;">Pending</span>
    <span id="stat-total">—</span>
  </div>
  <div class="stat-pill" id="pill-approved" onclick="setStatusFilter('approved')" title="Show approved questions">
    <span class="badge" style="background:#22c55e;">Approved</span>
    <span id="stat-approved">—</span>
  </div>
  <div class="stat-pill" id="pill-generated_flagged" onclick="setStatusFilter('generated_flagged')" title="Show flagged questions">
    <span class="badge" style="background:#f59e0b;">Flagged</span>
    <span id="stat-flagged">—</span>
  </div>
  <div class="stat-pill" id="pill-rejected" onclick="setStatusFilter('rejected')" title="Show rejected questions">
    <span class="badge" style="background:#ef4444;">Rejected</span>
    <span id="stat-rejected">—</span>
  </div>
  <div class="stat-pill" id="pill-promoted" onclick="setStatusFilter('promoted')" title="Show promoted questions">
    <span class="badge" style="background:#7c3aed;">Promoted</span>
    <span id="stat-promoted">—</span>
  </div>
  <div class="stat-pill" id="pill-reference" onclick="setStatusFilter('reference')" title="Test-run questions archived in reference pool" style="opacity:0.55;">
    <span class="badge" style="background:#6b7280;">Reference</span>
    <span id="stat-reference">—</span>
  </div>
  <select id="filter-skill" onchange="loadQuestions()" style="margin-left:auto;">
    <option value="">All skills</option>
    <option value="linear_eq_one_var">L1V — Linear Eq (1 var)</option>
    <option value="linear_eq_two_var">L2V — Linear Eq (2 var)</option>
    <option value="linear_inequalities">LIN — Linear Inequalities</option>
    <option value="systems_linear_eq">SLE — Systems (2 var)</option>
  </select>
</div>

<!-- ══ DIAGRAM MODAL ══════════════════════════════════════════════════════════ -->
<div class="diag-modal-overlay" id="diag-modal" onclick="closeDiagModal(event)">
  <div class="diag-modal-box" id="diag-modal-box">
    <button class="diag-modal-close" onclick="closeDiagModal()">✕</button>
    <div class="diag-modal-title" id="diag-modal-title"></div>
    <div id="diag-modal-content" style="display:flex; justify-content:center;"></div>
    <div id="diag-modal-stem" style="margin-top:16px; padding-top:14px; border-top:1px solid #e5e7eb;
         font-size:14px; color:#374151; line-height:1.6; max-width:540px;"></div>
  </div>
</div>

<!-- ══ REVIEW LAYOUT ══════════════════════════════════════════════════════ -->
<div class="review-layout">

  <!-- Left sidebar: question list -->
  <div class="q-sidebar" id="q-sidebar">
    <div class="sidebar-header" id="sidebar-header">0 questions</div>
    <div id="sidebar-list"></div>
  </div>

  <!-- Right: single question detail -->
  <div class="q-detail" id="q-detail">
    <div class="detail-empty" id="detail-empty">
      <span>Select a question from the list, or generate new questions.</span>
    </div>
    <div id="detail-panel" style="display:none;"></div>
  </div>

</div>

<script>
// ════════════════════════════════════════════════════════════════════════════
// Data + state
// ════════════════════════════════════════════════════════════════════════════
let allQuestions = [];
let currentIndex = 0;
let filteredQuestions = [];

// ════════════════════════════════════════════════════════════════════════════
// API helpers
// ════════════════════════════════════════════════════════════════════════════
async function apiGet(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`GET ${url} → ${r.status}`);
  return r.json();
}

async function apiPatch(url) {
  const r = await fetch(url, { method: 'PATCH' });
  if (!r.ok) throw new Error(`PATCH ${url} → ${r.status}`);
}

// ════════════════════════════════════════════════════════════════════════════
// Load
// ════════════════════════════════════════════════════════════════════════════
async function loadQuestions() {
  const status    = currentStatus;
  const skillKey  = document.getElementById('filter-skill').value;

  let url = `/api/admin/sympy/questions?status=${status}`;
  if (skillKey)   url += `&skillKey=${encodeURIComponent(skillKey)}`;

  setLoading(true);
  try {
    allQuestions = await apiGet(url);
    renderGrid(allQuestions);
    updateCount(allQuestions.length);
    await loadStats();
  } catch (e) {
    console.error(e);
    showEmpty(`Error loading questions: ${e.message}`);
  } finally {
    setLoading(false);
  }
}

async function loadStats() {
  try {
    const stats = await apiGet('/api/admin/sympy/stats');
    document.getElementById('stat-total').textContent     = stats.pendingReview ?? 0;
    document.getElementById('stat-approved').textContent  = stats.approved;
    document.getElementById('stat-flagged').textContent   = stats.flagged;
    document.getElementById('stat-rejected').textContent  = stats.rejected;
    document.getElementById('stat-promoted').textContent  = stats.promoted  ?? 0;
    document.getElementById('stat-reference').textContent = stats.reference ?? 0;

    document.getElementById('stats-bar').style.display = 'flex';
  } catch(e) { /* non-fatal */ }
}


function setStatusFilter(status) {
  // 'reference' is a pool value, not a status — handle separately
  if (status === 'reference') {
    currentStatus = 'all';
    currentPool = 'reference';
  } else {
    currentStatus = status;
    currentPool = 'active';
  }
  // Highlight the active pill
  document.querySelectorAll('.stat-pill').forEach(p => p.classList.remove('active-filter'));
  const pill = document.getElementById('pill-' + status);
  if (pill) pill.classList.add('active-filter');
  loadQuestions();
}

// ════════════════════════════════════════════════════════════════════════════
// Render
// ════════════════════════════════════════════════════════════════════════════
function renderGrid(questions) {
  let filtered = questions;
  if (currentPool === 'active') {
    filtered = filtered.filter(q => q.pool !== 'reference');
  } else if (currentPool) {
    filtered = filtered.filter(q => q.pool === currentPool);
  }

  filteredQuestions = filtered;

  const sidebarList = document.getElementById('sidebar-list');
  const sidebarHeader = document.getElementById('sidebar-header');

  if (filtered.length === 0) {
    sidebarList.innerHTML = '<div style="padding:16px 12px; font-size:13px; color:#9ca3af;">No questions match the current filters.</div>';
    sidebarHeader.textContent = '0 questions';
    document.getElementById('detail-empty').style.display = 'flex';
    document.getElementById('detail-panel').style.display = 'none';
    return;
  }

  sidebarHeader.textContent = filtered.length + ' question' + (filtered.length !== 1 ? 's' : '');
  sidebarList.innerHTML = filtered.map((q, i) => buildSidebarItem(q, i)).join('');

  // Show first question
  showQuestion(0);
}

function buildSidebarItem(q, index) {
  const poolBadge = q.pool
    ? `<span style="font-size:10px; font-weight:600; padding:1px 6px; border-radius:10px; background:#f3f4f6; color:#4b5563;">${q.pool}</span>`
    : '';
  return `
    <div class="sidebar-item" id="si-${q.id}" onclick="showQuestion(${index})">
      <span class="si-id">${escHtml(q.externalId || '—')}</span>
      <div class="si-meta">
        <span class="si-skill">${skillCode(q.skillKey)}</span>
        <span class="si-diff">d${q.difficulty}</span>
        ${poolBadge}
        <span class="si-status ${q.status}">${statusLabel(q.status)}</span>
      </div>
    </div>`;
}

function showQuestion(index) {
  if (filteredQuestions.length === 0) return;
  index = Math.max(0, Math.min(index, filteredQuestions.length - 1));
  currentIndex = index;
  const q = filteredQuestions[index];

  // Highlight active sidebar item
  document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
  const activeItem = document.getElementById(`si-${q.id}`);
  if (activeItem) {
    activeItem.classList.add('active');
    activeItem.scrollIntoView({ block: 'nearest' });
  }

  // Render detail panel
  const panel = document.getElementById('detail-panel');
  panel.style.display = 'block';
  document.getElementById('detail-empty').style.display = 'none';
  panel.innerHTML = buildDetailPanel(q);

  // Render KaTeX
  if (typeof renderMathInElement === 'function') {
    panel.querySelectorAll('.detail-stem, .detail-option span:nth-child(2), .detail-spr span:nth-child(2), .step-content, .core-concept-box, .alt-approach-box, .distractor-row span:nth-child(2)').forEach(el => {
      renderMathInElement(el, {
        delimiters: [
          { left: '\\[', right: '\\]', display: true  },  // new questions (primary)
          { left: '\\(', right: '\\)', display: false },   // new questions (primary)
          { left: '$$',  right: '$$',  display: true  },  // legacy reference pool
        ],
        throwOnError: false
      });
    });
  }

  // Render diagram
  if (q.diagram) {
    try {
      const spec = typeof q.diagram === 'string' ? JSON.parse(q.diagram) : q.diagram;
      const host = document.getElementById(`diagram-${q.id}`);
      if (host && spec) renderSympyDiagram(spec, host);
    } catch(e) { console.warn('Diagram render error:', e); }
  }

  // Update nav counter
  const counter = panel.querySelector('.nav-counter');
  if (counter) counter.textContent = (index + 1) + ' / ' + filteredQuestions.length;
  const btnPrev = panel.querySelector('.nav-prev');
  const btnNext = panel.querySelector('.nav-next');
  if (btnPrev) btnPrev.disabled = index === 0;
  if (btnNext) btnNext.disabled = index === filteredQuestions.length - 1;
}

function navPrev() { showQuestion(currentIndex - 1); }
function navNext() { showQuestion(currentIndex + 1); }

function buildDetailPanel(q) {
  const isMCQ = q.questionType === 'mcq';
  const isSPR = q.questionType === 'spr';
  const isFlagged = q.status === 'generated_flagged';

  // Flag banner
  const flagHtml = isFlagged && q.reviewNotes ? `
    <div class="flag-banner">
      <span style="font-size:14px;">⚠️</span>
      <span><strong>Sonnet flagged:</strong> ${escHtml(q.reviewNotes)}</span>
    </div>` : '';

  // Diagram
  const diagHtml = q.diagram ? `
    <div class="q-diagram" id="diagram-${q.id}" onclick="openDiagModal('${q.id}')" title="Click to enlarge" style="margin:0 0 18px; cursor:zoom-in; text-align:center;"></div>` : '';

  // Options (MCQ)
  const optionsHtml = isMCQ ? `
    <div class="detail-options">
      ${['A','B','C','D'].map(letter => {
        const text = q['option' + letter];
        if (!text) return '';
        const isCorrect = q.correctAnswer === letter;
        return `
          <div class="detail-option ${isCorrect ? 'correct' : ''}">
            <span class="opt-letter">${letter}</span>
            <span>${escHtml(text)}</span>
            ${isCorrect ? '<span style="margin-left:auto; font-size:11px; color:#16a34a; font-weight:700;">✓ correct</span>' : ''}
          </div>`;
      }).join('')}
    </div>` : '';

  // SPR answer
  const sprHtml = isSPR ? `
    <div class="detail-spr">
      <span style="font-size:11px; font-weight:600; color:#15803d;">Answer:</span>
      <span>${escHtml(q.correctAnswer || '—')}</span>
      ${(q.sprMin != null && parseFloat(q.sprMin) !== parseFloat(q.sprMax)) ? `<span style="font-size:11px; color:#6b7280; margin-left:4px;">(range: ${q.sprMin} – ${q.sprMax})</span>` : ''}
    </div>` : '';

  // Core concept
  const coreConceptHtml = q.coreConcept ? `
    <div class="detail-section">
      <div class="detail-section-title">Core Concept</div>
      <div class="core-concept-box">${escHtml(q.coreConcept)}</div>
    </div>` : '';

  // Prerequisites
  let prereqHtml = '';
  if (q.prerequisites) {
    try {
      const prereqs = typeof q.prerequisites === 'string' ? JSON.parse(q.prerequisites) : q.prerequisites;
      if (Array.isArray(prereqs) && prereqs.length) {
        prereqHtml = `
          <div class="detail-section">
            <div class="detail-section-title">Prerequisites</div>
            <div class="prereq-list">
              ${prereqs.map(p => `<span class="prereq-tag">${escHtml(p)}</span>`).join('')}
            </div>
          </div>`;
      }
    } catch(e) { /* skip */ }
  }

  // Solution steps
  let stepsHtml = '';
  if (q.explanationSteps) {
    try {
      const steps = typeof q.explanationSteps === 'string' ? JSON.parse(q.explanationSteps) : q.explanationSteps;
      if (Array.isArray(steps) && steps.length) {
        stepsHtml = `
          <div class="detail-section">
            <div class="detail-section-title">Solution Steps</div>
            <div class="steps-list">
              ${steps.map((s, i) => `
                <div class="step-row">
                  <div class="step-num">${(s.step != null ? s.step : i + 1)}</div>
                  <div class="step-content">
                    ${s.title ? `<div class="step-title">${escHtml(s.title)}</div>` : ''}
                    <div>${escHtml(s.content || '')}</div>
                  </div>
                </div>`).join('')}
            </div>
          </div>`;
      }
    } catch(e) { /* skip */ }
  }

  // Distractor rationale (MCQ only)
  let distractorHtml = '';
  if (isMCQ && q.distractorRationale) {
    try {
      const dr = typeof q.distractorRationale === 'string' ? JSON.parse(q.distractorRationale) : q.distractorRationale;
      const entries = Object.entries(dr).filter(([letter]) => letter !== q.correctAnswer);
      if (entries.length) {
        distractorHtml = `
          <div class="detail-section">
            <div class="detail-section-title">Distractor Rationale</div>
            <div class="distractor-list">
              ${entries.map(([letter, text]) => `
                <div class="distractor-row">
                  <span class="distractor-letter">${letter}</span>
                  <span>${escHtml(text)}</span>
                </div>`).join('')}
            </div>
          </div>`;
      }
    } catch(e) { /* skip */ }
  }

  // Alternative approach
  const altHtml = q.alternativeApproach ? `
    <div class="detail-section">
      <div class="detail-section-title">Alternative Approach</div>
      <div class="alt-approach-box">${escHtml(q.alternativeApproach)}</div>
    </div>` : '';

  // Pool badge
  const poolBadge = q.pool ? `<span class="badge-pool ${q.pool}">${q.pool}</span>` : '';

  // Scenario tag
  const scenarioHtml = q.scenarioTag
    ? `<span style="font-size:11px; padding:2px 7px; border-radius:20px; background:#f3f4f6; color:#6b7280;">${q.scenarioTag.replace(/_/g,' ')}</span>`
    : '';

  // Pool override select
  const poolOverride = q.status !== 'promoted' ? `
    <select class="pool-override" onchange="updatePool('${q.id}', this.value)" title="Change pool">
      <option value="diagnostic" ${q.pool==='diagnostic'?'selected':''}>diagnostic</option>
      <option value="drill"      ${q.pool==='drill'?'selected':''}>drill</option>
      <option value="test"       ${q.pool==='test'?'selected':''}>test</option>
      <option value="reference"  ${q.pool==='reference'?'selected':''}>reference</option>
    </select>` : '';

  // Action buttons
  const actionBtns = (() => {
    const id = `'${q.id}'`;
    if (q.status === 'promoted') {
      return `<span style="font-size:12px; color:#7c3aed; font-weight:600;">⬆ Promoted to production</span>
              <button class="btn-revert" style="margin-left:8px;" onclick="revert(${id}, this)">↩ Revert</button>`;
    }
    if (q.status === 'approved') {
      return `<button class="btn-promote" onclick="promoteQ(${id}, this)">⬆ Promote</button>
              <button class="btn-revert"  onclick="revert(${id}, this)">↩ Revert</button>
              <button class="btn-reject"  onclick="rejectQ(${id}, this)">Reject</button>`;
    }
    if (q.status === 'rejected') {
      return `<button class="btn-promote"     onclick="approveAndPromote(${id}, this)">✓ Approve &amp; Promote</button>
              <button class="btn-approve-only" onclick="approveOnly(${id}, this)">Approve only</button>
              <button class="btn-revert"       onclick="revert(${id}, this)">↩ Revert</button>`;
    }
    return `<button class="btn-promote"     onclick="approveAndPromote(${id}, this)">✓ Approve &amp; Promote</button>
            <button class="btn-approve-only" onclick="approveOnly(${id}, this)">Approve only</button>
            <button class="btn-reject"       onclick="rejectQ(${id}, this)">✗ Reject</button>`;
  })();

  // Math object debug
  const moFormatted = q.mathObject
    ? (() => { try { return JSON.stringify(typeof q.mathObject === 'string' ? JSON.parse(q.mathObject) : q.mathObject, null, 2); } catch(e) { return String(q.mathObject); } })()
    : null;
  const debugHtml = moFormatted ? `
    <div class="detail-section">
      <button class="btn-debug" onclick="toggleDebug(this)">{ } math_object</button>
      <pre class="debug-panel">${escHtml(moFormatted)}</pre>
    </div>` : '';

  return `
    <div class="detail-card ${q.status}" id="detail-card-${q.id}">
      <div class="detail-header">
        <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
          <span class="q-id" style="font-size:13px;">${escHtml(q.externalId || '—')}</span>
          <div class="q-meta">
            <span class="badge-skill">${skillCode(q.skillKey)}</span>
            <span class="badge-diff">d${q.difficulty}</span>
            <span class="badge-type">${q.questionType?.toUpperCase()}</span>
            ${poolBadge}
            ${scenarioHtml}
            <span class="badge-status ${q.status}">${statusLabel(q.status)}</span>
          </div>
        </div>
        <div class="detail-nav">
          <button class="nav-arrow nav-prev" onclick="navPrev()" ${currentIndex === 0 ? 'disabled' : ''}>←</button>
          <span class="nav-counter">${(currentIndex + 1)} / ${filteredQuestions.length}</span>
          <button class="nav-arrow nav-next" onclick="navNext()" ${currentIndex === filteredQuestions.length - 1 ? 'disabled' : ''}>→</button>
        </div>
      </div>
      <div class="detail-body">
        <div class="detail-columns">
          <div class="detail-left">
            ${flagHtml}
            <div class="stem-wrap" data-qid="${q.id}" style="display:flex; align-items:flex-start; gap:8px; margin-bottom:18px;">
              <div class="detail-stem" style="flex:1; margin-bottom:0;">${escHtml(q.questionStem || '')}</div>
              <button onclick="editStem(this)"
                      style="flex-shrink:0; background:none; border:1.5px solid #e5e7eb; border-radius:6px;
                             padding:4px 8px; font-size:12px; color:#9ca3af; cursor:pointer; margin-top:2px;"
                      title="Edit question stem">✏</button>
            </div>
            <div class="stem-edit" data-qid="${q.id}" style="display:none; margin-bottom:18px;">
              <textarea class="stem-textarea"
                        style="width:100%; min-height:100px; font-size:15px; line-height:1.6; color:#111827;
                               border:2px solid #6366f1; border-radius:8px; padding:10px 12px; resize:vertical;
                               font-family:inherit; box-sizing:border-box;"></textarea>
              <div style="display:flex; gap:8px; margin-top:6px;">
                <button onclick="saveStem(this)"
                        style="background:#6366f1; color:#fff; border:none; border-radius:7px;
                               padding:6px 16px; font-size:13px; font-weight:600; cursor:pointer;">Save</button>
                <button onclick="cancelStemEdit(this)"
                        style="background:#f3f4f6; color:#374151; border:1.5px solid #d1d5db; border-radius:7px;
                               padding:6px 14px; font-size:13px; cursor:pointer;">Cancel</button>
              </div>
            </div>
            ${diagHtml}
            ${optionsHtml}
            ${sprHtml}
          </div>
          <div class="detail-right">
            ${coreConceptHtml}
            ${prereqHtml}
            ${stepsHtml}
            ${distractorHtml}
            ${altHtml}
            ${debugHtml}
          </div>
        </div>
      </div>
      <div class="detail-actions">
        ${actionBtns}
        ${poolOverride}
        <span style="margin-left:auto; font-size:11px; color:#d1d5db; font-family:monospace;">${q.paramHash ? q.paramHash.substring(0,12)+'…' : ''}</span>
      </div>
    </div>`;
}

// ════════════════════════════════════════════════════════════════════════════
// Actions
// ════════════════════════════════════════════════════════════════════════════
function _updateQuestionStatus(id, newStatus) {
  // Update in allQuestions and filteredQuestions arrays
  [allQuestions, filteredQuestions].forEach(arr => {
    const q = arr.find(x => x.id === id);
    if (q) q.status = newStatus;
  });
  // Refresh sidebar item badge
  const q = allQuestions.find(x => x.id === id);
  const siEl = document.getElementById(`si-${id}`);
  if (siEl && q) {
    const badge = siEl.querySelector('.si-status');
    if (badge) {
      badge.className = `si-status ${newStatus}`;
      badge.textContent = statusLabel(newStatus);
    }
  }
  // Re-render detail panel
  showQuestion(currentIndex);
}

async function approveAndPromote(id, btn) {
  btn.disabled = true; btn.textContent = '…';
  try {
    const result = await fetch(`/api/admin/sympy/questions/${id}/approve-and-promote`, { method: 'PATCH' });
    if (!result.ok) throw new Error(`${result.status}`);
    _updateQuestionStatus(id, 'promoted');
    loadStats();
  } catch(e) { alert('Approve & Promote failed: ' + e.message); btn.disabled = false; btn.textContent = '✓ Approve & Promote'; }
}

async function approveOnly(id, btn) {
  btn.disabled = true; btn.textContent = '…';
  try {
    await apiPatch(`/api/admin/sympy/questions/${id}/approve`);
    _updateQuestionStatus(id, 'approved');
    loadStats();
  } catch(e) { alert('Approve failed: ' + e.message); btn.disabled = false; btn.textContent = 'Approve only'; }
}

async function promoteQ(id, btn) {
  btn.disabled = true; btn.textContent = '…';
  try {
    const result = await fetch(`/api/admin/sympy/questions/${id}/approve-and-promote`, { method: 'PATCH' });
    if (!result.ok) throw new Error(`${result.status}`);
    _updateQuestionStatus(id, 'promoted');
    loadStats();
  } catch(e) { alert('Promote failed: ' + e.message); btn.disabled = false; btn.textContent = '⬆ Promote'; }
}

async function rejectQ(id, btn) {
  btn.disabled = true; btn.textContent = '…';
  try {
    await apiPatch(`/api/admin/sympy/questions/${id}/reject`);
    _updateQuestionStatus(id, 'rejected');
    loadStats();
  } catch(e) { alert('Reject failed: ' + e.message); btn.disabled = false; btn.textContent = '✗ Reject'; }
}

function editStem(btn) {
  const wrapEl = btn.closest('.stem-wrap');
  if (!wrapEl) return;
  const id     = wrapEl.dataset.qid;
  const editEl = wrapEl.nextElementSibling;  // .stem-edit
  const q      = allQuestions.find(x => x.id === id);
  if (!q || !editEl) return;
  editEl.querySelector('.stem-textarea').value = q.questionStem || '';
  wrapEl.style.display = 'none';
  editEl.style.display = 'block';
  editEl.querySelector('.stem-textarea').focus();
}

function cancelStemEdit(btn) {
  const editEl = btn.closest('.stem-edit');
  if (!editEl) return;
  editEl.style.display = 'none';
  editEl.previousElementSibling.style.display = 'flex'; // .stem-wrap
}

async function saveStem(btn) {
  const editEl  = btn.closest('.stem-edit');
  if (!editEl) return;
  const id      = editEl.dataset.qid;
  const newStem = editEl.querySelector('.stem-textarea').value.trim();
  if (!newStem) return;
  btn.disabled = true; btn.textContent = '…';
  try {
    const r = await fetch(`/api/admin/sympy/questions/${id}/stem`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ questionStem: newStem })
    });
    if (!r.ok) throw new Error(`${r.status}`);
    [allQuestions, filteredQuestions].forEach(arr => {
      const q = arr.find(x => x.id === id);
      if (q) q.questionStem = newStem;
    });
    showQuestion(currentIndex);
  } catch(e) {
    alert('Save failed: ' + e.message);
    btn.disabled = false; btn.textContent = 'Save';
  }
}

async function revert(id, btn) {
  btn.disabled = true; btn.textContent = '…';
  try {
    await apiPatch(`/api/admin/sympy/questions/${id}/pending`);
    _updateQuestionStatus(id, 'generated');
    loadStats();
  } catch(e) { alert('Revert failed: ' + e.message); btn.disabled = false; btn.textContent = '↩ Revert'; }
}

async function updatePool(id, newPool) {
  try {
    const r = await fetch(`/api/admin/sympy/questions/${id}/pool?pool=${encodeURIComponent(newPool)}`, { method: 'PATCH' });
    if (!r.ok) throw new Error(`${r.status}`);
    // Update pool in data arrays
    [allQuestions, filteredQuestions].forEach(arr => {
      const q = arr.find(x => x.id === id);
      if (q) q.pool = newPool;
    });
    showQuestion(currentIndex);
  } catch(e) { alert('Pool update failed: ' + e.message); }
}

// ════════════════════════════════════════════════════════════════════════════
// Diagram modal
// ════════════════════════════════════════════════════════════════════════════
function openDiagModal(qId) {
  const q = allQuestions.find(x => x.id === qId);
  if (!q || !q.diagram) return;

  const spec = typeof q.diagram === 'string' ? JSON.parse(q.diagram) : q.diagram;
  const content = document.getElementById('diag-modal-content');
  content.innerHTML = '';
  renderSympyDiagram(spec, content);

  // Scale up SVG for modal
  const svg = content.querySelector('svg');
  if (svg) {
    const origW = parseInt(svg.getAttribute('width') || 300);
    const origH = parseInt(svg.getAttribute('height') || 240);
    const scale = Math.min(600 / origW, 500 / origH, 2.2);
    svg.setAttribute('width',  Math.round(origW * scale));
    svg.setAttribute('height', Math.round(origH * scale));
    const vb = svg.getAttribute('viewBox') || `0 0 ${origW} ${origH}`;
    if (!svg.getAttribute('viewBox')) svg.setAttribute('viewBox', vb);
  }

  document.getElementById('diag-modal-title').textContent =
    `${q.externalId}  ·  ${spec.type}  ·  d${q.difficulty}`;

  const stemEl = document.getElementById('diag-modal-stem');
  stemEl.textContent = q.questionStem || '';
  if (typeof renderMathInElement === 'function') {
    renderMathInElement(stemEl, {
      delimiters: [{left:'\\[',right:'\\]',display:true},{left:'\\(',right:'\\)',display:false},{left:'$$',right:'$$',display:true}],
      throwOnError: false
    });
  }

  document.getElementById('diag-modal').classList.add('open');
}

function closeDiagModal(event) {
  if (event && event.target !== document.getElementById('diag-modal')) return;
  document.getElementById('diag-modal').classList.remove('open');
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    document.getElementById('diag-modal').classList.remove('open');
    return;
  }
  // Arrow key navigation (only when not focused in an input/select)
  const tag = document.activeElement ? document.activeElement.tagName : '';
  if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   { e.preventDefault(); navPrev(); }
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); navNext(); }
});
