spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/satengine
    username: roms_user
    password: roms_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

anthropic:
  api-key: ${ANTHROPIC_API_KEY:}

# Neon sync — target DB for pushing approved questions from local to production.
# Set these when running locally so the "Sync to Neon" button works.
# Leave blank on Railway (syncing from Neon to itself is a no-op).
neon:
  jdbc:
    url:      ${NEON_SYNC_URL:}
    username: ${NEON_SYNC_USERNAME:}
    password: ${NEON_SYNC_PASSWORD:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    url: /api-docs/openapi.yaml
    disable-swagger-default-url: true

# ── Actuator ──────────────────────────────────────────────────────────────────
# Only expose /health — never expose /env, /beans, /heapdump (security risk)
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: never   # don't leak DB URL / credentials in health response
  info:
    env:
      enabled: true

# ── Sentry ────────────────────────────────────────────────────────────────────
# Set SENTRY_DSN on Railway. Leave blank locally — Sentry is a no-op when DSN absent.
sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:local}
  traces-sample-rate: 0.0   # error capture is free; tracing costs quota — enable later
  logging:
    minimum-event-level: error          # only send ERROR logs to Sentry
    minimum-breadcrumb-level: info      # attach INFO+ as breadcrumb context on errors
