spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/satengine
    username: roms_user
    password: roms_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

anthropic:
  api-key: ${ANTHROPIC_API_KEY:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    url: /api-docs/openapi.yaml
    disable-swagger-default-url: true
